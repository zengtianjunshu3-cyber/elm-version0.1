spring.application.name=elm
server.servlet.context-path=/elm

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/elm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.neusoft.elmboot.po
mybatis.configuration.map-underscore-to-camel-case=true

# Logging
logging.level.com.neusoft.elmboot.mapper=debug

# 文件上传大小限制 (兼容不同版本)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 不要显式指定 location，让 Spring 使用默认系统临时目录，避免权限和路径不存在问题
# spring.servlet.multipart.location=uploads/temp/

# 强制开启静态资源映射刷新
spring.web.resources.static-locations=classpath:/static/,file:uploads/
